# 加到现有 nginx server{}。生产 location 保持不变。
# /mcp-sap-bak/mcp     → 127.0.0.1:3100/mcp
# /mcp-sap-bak-dev/mcp → 127.0.0.1:3101/mcp

location /mcp-sap-bak/ {
    proxy_pass http://127.0.0.1:3100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

location /mcp-sap-bak-dev/ {
    proxy_pass http://127.0.0.1:3101/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

# WorkBuddy OAuth 发现会打站点根路径（RFC 8414 / 9728）
location = /.well-known/oauth-authorization-server/mcp-sap-bak-dev {
    proxy_pass http://127.0.0.1:3101/.well-known/oauth-authorization-server;
    proxy_set_header Host $host;
}

location = /.well-known/oauth-protected-resource/mcp-sap-bak-dev/mcp {
    proxy_pass http://127.0.0.1:3101/.well-known/oauth-protected-resource/mcp;
    proxy_set_header Host $host;
}

# 兼容客户端把 /authorize /token 解析到站点根（丢掉 /mcp-sap-bak-dev 前缀）
location = /authorize { proxy_pass http://127.0.0.1:3101/authorize; proxy_set_header Host $host; }
location = /token     { proxy_pass http://127.0.0.1:3101/token; proxy_set_header Host $host; }
location = /register  { proxy_pass http://127.0.0.1:3101/register; proxy_set_header Host $host; }
location = /revoke    { proxy_pass http://127.0.0.1:3101/revoke; proxy_set_header Host $host; }
location = /login     { proxy_pass http://127.0.0.1:3101/login; proxy_set_header Host $host; }
location /api/login   { proxy_pass http://127.0.0.1:3101/api/login; proxy_set_header Host $host; }
